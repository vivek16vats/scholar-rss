name: Update Scholar Feed

on:
  schedule:
    - cron: '0 0 * * *'   # Daily at 00:00 UTC

  workflow_dispatch:

jobs:
  update:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run RSS generator
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          python RSS.py

      - name: Commit and push updates
        run: |
          git config user.name "vivek16vats"
          git config user.email "vivek16vats@gmail.com"

          git add scholar.xml
          git add scholar_complete.json

          git diff --staged --quiet || git commit -m "Auto-update Scholar RSS"

          git push
