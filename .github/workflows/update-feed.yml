import json
import requests
from pathlib import Path
from feedgen.feed import FeedGenerator

AUTHOR_ID = "A5010738988"

CACHE_FILE = "known_works.json"
RSS_FILE = "feed.xml"

API_URL = (
    "https://api.openalex.org/works"
    f"?filter=author.id:https://openalex.org/{AUTHOR_ID}"
    "&sort=publication_date:desc"
    "&per-page=200"
)

response = requests.get(API_URL, timeout=60)
response.raise_for_status()

works = response.json()["results"]

if Path(CACHE_FILE).exists():
    with open(CACHE_FILE, "r", encoding="utf-8") as f:
        known_works = set(json.load(f))
else:
    known_works = set()

current_works = set()

fg = FeedGenerator()

fg.title("Latest Research Publications")
fg.description(
    "Automatically updated publication feed"
)

fg.link(
    href=f"https://openalex.org/{AUTHOR_ID}"
)

fg.language("en")

for work in works:

    work_id = work["id"]

    current_works.add(work_id)

    title = work.get("display_name", "Untitled")

    publication_date = (
        work.get("publication_date")
        or ""
    )

    cited_by = (
        work.get("cited_by_count")
        or 0
    )

    doi = work.get("doi")

    landing_page = (
        work.get("primary_location", {})
        .get("landing_page_url")
    )

    entry = fg.add_entry()

    entry.id(work_id)

    entry.title(title)

    if landing_page:
        entry.link(href=landing_page)

    elif doi:
        entry.link(href=doi)

    description = f"""
Publication Date: {publication_date}

Citations: {cited_by}

DOI: {doi if doi else "N/A"}
"""

    entry.description(description)

    if publication_date:
        try:
            entry.pubDate(publication_date)
        except Exception:
            pass

fg.rss_file(RSS_FILE)

with open(
    CACHE_FILE,
    "w",
    encoding="utf-8"
) as f:

    json.dump(
        sorted(list(current_works)),
        f,
        indent=2
    )

print(
    f"RSS generated with "
    f"{len(works)} works."
)
